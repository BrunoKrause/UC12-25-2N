<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Instagram</title>
</head>
<body>
    <div id="container">

        <aside>
            <div id="div-logo">
                <img src="icones/logo-instagram.svg" alt="logo" width="30">
                <h1>Instagram</h1>
            </div>

            <div id="div-perfil">
                <div id="foto-perfil"></div>
                <h2>Usuario</h2>
                <h3>nome</h3>

                <div id="div-stats">
                    <div id="div-posts">
                        <h5 class="stats-quantidade">58</h5>
                        <h5 class="stats-titulo">Posts</h5>
                    </div>
                    
                    <div id="div-seguidores">
                        <h5 class="stats-quantidade">3k</h5>
                        <h5 class="stats-titulo">Seguidores<h5>
                    </div>

                    <div id="div-seguindo">
                        <h5 class="stats-quantidade">542</h5>
                        <h5 class="stats-titulo">Seguindo</h5>
                    </div>
                </div>
            </div>

            <div id="div-sugestoes">
                <h2>Sugestões para você</h2>

                <div class="div-sugestoes">
                    <div class="foto-sugestao"></div>

                </div>

                <div class="div-sugestoes">
                    <div class="foto-sugestao"></div>
                    
                </div>

                <div class="div-sugestoes">
                    <div class="foto-sugestao"></div>
                    
                </div>

                <div class="div-sugestoes">
                    <div class="foto-sugestao"></div>
                    
                </div>

                <div class="div-sugestoes">
                    <div class="foto-sugestao"></div>

                </div>
            </div>

            <footer>
                <div id="div-opcoes">
                    <div id="settings">
                        <img src="icones/definicoes.svg" alt="" class="img-footer">
                        <h4>Configurações</h4>
                    </div>
                    <div id="logoff">
                        <img src="icones/saida.svg" alt="" class="img-footer">
                        <h4>Sair</h4>
                    </div>
                </div>
            </footer>
            
        </aside>
        
        <main>
            <section id="inicio">
                <header>
                    <div id="div-inicio">
                        <input type="text" placeholder="Search">

                        <nav>
                            <a href="#inicio" class="nav-opcao"><img src="icones/home-outline.svg" alt=""></a>
                            <a href="" class="nav-opcao"><img src="icones/compass-outline.svg" alt=""></a>
                            <a href="" class="nav-opcao" id="play"><img src="icones/reproduzir-alt.svg" alt=""></a>
                            <a href="" class="nav-opcao"><img src="icones/bag-outline.svg" alt=""></a>
                        </nav>
                    </div>

                    <div id="div-direita">
                        <nav>
                            <a href="" class="nav-opcao"><img src="icones/aviao-de-papel.svg" alt=""></a>
                            <a href="" class="nav-opcao"><img src="icones/coracao.svg" alt=""></a>
                        </nav>

                        <button id="new-post">
                            <img src="icones/quadrado-mais.svg" alt="">
                            <h4>New post</h4>
                        </button>
                    </div>
                </header>
            </section>

            <section id="stories">
                <div class="div-stories">
                    <div class="foto-stories"></div>
                    <h3>Usuario</h3>
                </div>
                <div class="div-stories">
                    <div class="foto-stories"></div>
                    <h3>Usuario</h3>
                </div>
                <div class="div-stories">
                    <div class="foto-stories"></div>
                    <h3>Usuario</h3>
                </div>
                <div class="div-stories">
                    <div class="foto-stories"></div>
                    <h3>Usuario</h3>
                </div>
                <div class="div-stories">
                    <div class="foto-stories"></div>
                    <h3>Usuario</h3>
                </div>
                <div class="div-stories">
                    <div class="foto-stories"></div>
                    <h3>Usuario</h3>
                </div>
            </section>
        </main>

    </div>
    
</body>
</html>
