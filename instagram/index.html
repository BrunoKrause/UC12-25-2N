<!DOCTYPE html>
<html lang="pt-BR">
<head>

                    </div>

                </div>

                </div>
            </div>

            <footer>
                <div id="div-opcoes">
                    <div id="settings">
                        <h4>Configurações</h4>
                    </div>
                    <div id="logoff">
                        <h4>Sair</h4>
                    </div>
                </div>
            </footer>
            
        </aside>
        
        <main>
            <header>
                <div>
                    <label for="search">Search</label>
                    <input type=""

            </header>
